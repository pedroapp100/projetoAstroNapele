<!doctype html>
<!--
  Diagnóstico de scrub de vídeo no celular (passeio da clínica). NÃO faz parte do site: é uma ferramenta para abrir no aparelho de verdade.

  Por quê: o Chrome headless não reproduz o decoder, a política de autoplay nem o Modo de Baixo Consumo do iPhone. Esta página toca os mesmos
  clipes do passeio de três jeitos e mostra, sobre cada quadro, se a imagem está MOVENDO ou CONGELADA enquanto você rola.

  Como usar: abra /diag/scrub.html no iPhone, role para cima e para baixo algumas vezes (até o fim da página) e tire UMA captura de tela.

    A BLOB (como o site carrega hoje) e B DIRETO ambos CONGELADOS      -> o aparelho não pinta esse clipe (veja o "prime" abaixo de cada um)
    A CONGELADO, B MOVENDO                                              -> o problema é carregar como blob
    A MOVENDO, B CONGELADO                                              -> o problema é o arquivo direto (rede / faixa de bytes)
    A, B e C MOVENDO                                                    -> o vídeo está ok; o defeito está na página (layout / transformações)
    "prime: NotAllowedError" em todos e tudo CONGELADO                  -> Modo de Baixo Consumo: o play() só vale dentro de um toque
    C (passeio.mp4, 720p, o arquivo do desktop) MOVENDO e A/B não       -> o clipe leve do celular é o problema (codificação)

  Para apagar depois: remova a pasta public/diag/.

  A rolagem dirige os clipes por um laço rAF (não por eventos de scroll), como a skill scroll-craft faz, para não depender de um ambiente
  que mexe na página sem disparar scroll.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>diagnóstico de scrub</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  html { background: #0b0f14; color: #e8edf2; font: 13px/1.45 ui-monospace, Menlo, Consolas, monospace; }
  body { height: 520vh; }
  .panel { position: fixed; inset: 0; padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  h1 { font-size: 14px; font-weight: 600; }
  .hint { color: #8fa0b3; }
  .row { display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; }
  .cell { display: grid; grid-template-columns: 38% 1fr; gap: 8px; align-items: start; }
  .cell video { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #000; display: block; border: 1px solid #26303c; border-radius: 6px; }
  .name { font-weight: 600; margin: 0 0 2px; }
  .verdict { font-size: 15px; font-weight: 700; padding: 2px 6px; border-radius: 4px; display: inline-block; }
  .wait { background: #26303c; }
  .ok { background: #0f5132; color: #b6f0cd; }
  .bad { background: #6b1220; color: #ffc2cd; }
  .stats { color: #aab7c4; font-size: 11px; white-space: pre-line; }
  #meta { color: #8fa0b3; font-size: 11px; }
  #log { flex: 1 1 auto; overflow: auto; background: #10161d; border: 1px solid #26303c; border-radius: 6px; padding: 8px; font-size: 10.5px; color: #9fb4c8; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="panel">
  <h1>diagnóstico de scrub: ROLE PARA CIMA E PARA BAIXO ALGUMAS VEZES, depois leia os veredictos</h1>
  <div class="hint">A: clipe leve, BLOB (como o site carrega) &nbsp;·&nbsp; B: o mesmo clipe, arquivo DIRETO &nbsp;·&nbsp; C: clipe do desktop, BLOB</div>
  <div class="row" id="cells"></div>
  <div id="meta"></div>
  <div id="log"></div>
</div>
<script>
(function () {
  'use strict';

  var SUSPECT = '/assets/clinica/passeio-m.mp4';
  var CONTRAST = '/assets/clinica/passeio.mp4';
  var TESTS = [
    { key: 'A', label: 'A  passeio-m.mp4  BLOB', src: SUSPECT, mode: 'blob' },
    { key: 'B', label: 'B  passeio-m.mp4  DIRETO', src: SUSPECT, mode: 'direct' },
    { key: 'C', label: 'C  passeio.mp4 (desktop)  BLOB', src: CONTRAST, mode: 'blob' }
  ];

  var logEl = document.getElementById('log');
  function log(m) {
    logEl.textContent += m + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  }
  window.addEventListener('error', function (e) { log('ERRO JS: ' + e.message); });

  var maxScrolled = 0;
  var cellsEl = document.getElementById('cells');
  var canvas = document.createElement('canvas');
  canvas.width = 16; canvas.height = 16;
  var ctx = canvas.getContext('2d', { willReadFrequently: true });

  function make(t) {
    var cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML = '<video muted playsinline preload="auto" id="el' + t.key + '"></video>' +
      '<div><div class="name">' + t.label + '</div>' +
      '<span class="verdict wait" id="v' + t.key + '">…</span>' +
      '<div class="stats" id="s' + t.key + '"></div></div>';
    cellsEl.appendChild(cell);

    var T = {
      key: t.key, el: cell.querySelector('video'),
      verdict: cell.querySelector('.verdict'),
      stats: cell.querySelector('.stats'),
      seeked: 0, hashes: {}, hashCount: 0, prime: 'não tentado',
      primed: false, priming: false, err: ''
    };
    T.el.muted = true; T.el.playsInline = true;

    T.el.addEventListener('seeked', function () { T.seeked++; });
    T.el.addEventListener('error', function () {
      var e = T.el.error;
      T.err = 'MediaError código ' + (e ? e.code : '?');
      log(t.key + ': ' + T.err);
    });
    T.el.addEventListener('loadedmetadata', function () {
      log(t.key + ': metadados, duração ' + T.el.duration.toFixed(2) + 's');
      try { T.el.currentTime = 0.001; } catch (e) {}
      prime(T, 'load'); // igual ao site: tenta primeiro sem gesto
    });

    if (t.mode === 'blob') {
      fetch(t.src)
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
        .then(function (b) {
          log(t.key + ': baixou ' + (b.size / 1048576).toFixed(2) + ' MB, blob definido');
          T.el.src = URL.createObjectURL(b);
        })
        .catch(function (e) { T.err = 'fetch falhou: ' + e.message; log(t.key + ': ' + T.err); });
    } else {
      T.el.src = t.src;
      log(t.key + ': src direto definido');
    }
    return T;
  }

  function prime(T, why) {
    if (T.primed || T.priming || !T.el.src) return;
    T.priming = true;
    var pr;
    try { pr = T.el.play(); } catch (e) { T.priming = false; T.prime = 'lançou exceção (' + why + ')'; return; }
    setTimeout(function () {
      if (T.priming) { T.priming = false; if (T.prime === 'não tentado') T.prime = 'play() nunca resolveu (' + why + ')'; }
    }, 2000);
    if (pr && pr.then) {
      pr.then(function () {
        T.priming = false; T.primed = true; T.prime = 'OK (' + why + ')';
        try { T.el.pause(); } catch (e) {}
        log(T.key + ': preparado via ' + why);
      }, function (e) {
        T.priming = false; T.prime = (e && e.name ? e.name : 'recusado') + ' (' + why + ')';
        log(T.key + ': play() recusado via ' + why + ': ' + (e && e.name));
      });
    } else { T.priming = false; T.primed = true; T.prime = 'OK sync (' + why + ')'; try { T.el.pause(); } catch (e) {} }
  }

  var tests = TESTS.map(make);

  function primeAll(ev) { tests.forEach(function (T) { prime(T, ev); }); }
  ['touchstart', 'touchend', 'pointerdown', 'click', 'scroll'].forEach(function (ev) {
    addEventListener(ev, function () { primeAll(ev); }, { passive: true });
  });

  var lastY = -1, lastPrimeTry = 0;
  function loop() {
    var maxY = document.body.scrollHeight - innerHeight;
    var p = maxY > 0 ? Math.max(0, Math.min(1, scrollY / maxY)) : 0;
    if (scrollY !== lastY) {
      if (lastY !== -1 && performance.now() - lastPrimeTry > 600) {
        lastPrimeTry = performance.now();
        primeAll('scrollmove');
      }
      lastY = scrollY;
      maxScrolled = Math.max(maxScrolled, p);
    }
    tests.forEach(function (T) {
      if (!T.el.duration || T.el.seeking) return;
      var t = p * T.el.duration * 0.98;
      if (Math.abs(T.el.currentTime - t) > 0.02) {
        try { T.el.currentTime = t; } catch (e) {}
      }
    });
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function frameHash(T) {
    if (T.el.readyState < 2) return null;
    try {
      ctx.drawImage(T.el, 0, 0, 16, 16);
      var d = ctx.getImageData(0, 0, 16, 16).data, h = 0;
      for (var i = 0; i < d.length; i += 7) h = (h * 31 + d[i]) >>> 0;
      return h;
    } catch (e) { return null; }
  }

  setInterval(function () {
    tests.forEach(function (T) {
      var h = frameHash(T);
      if (h !== null && !T.hashes[h]) { T.hashes[h] = 1; T.hashCount++; }
      T.stats.textContent =
        'prime: ' + T.prime +
        '\nreadyState ' + T.el.readyState + ' · seeks ' + T.seeked +
        '\ntempo ' + T.el.currentTime.toFixed(2) + 's · quadros distintos ' + T.hashCount +
        (T.err ? '\n' + T.err : '');
      if (T.hashCount >= 3) { T.verdict.textContent = 'MOVENDO'; T.verdict.className = 'verdict ok'; }
      else if (T.err) { T.verdict.textContent = 'ERRO'; T.verdict.className = 'verdict bad'; }
      else if (maxScrolled > 0.35) { T.verdict.textContent = 'CONGELADO'; T.verdict.className = 'verdict bad'; }
    });
  }, 250);

  document.getElementById('meta').textContent =
    navigator.userAgent + ' · ' + innerWidth + 'x' + innerHeight +
    ' · dpr ' + devicePixelRatio;
})();
</script>
</body>
</html>
